{% extends "base.html" %}
{% block content%}
    <div class="container" style="height: 46.5rem;">
        <form method="POST">
            {% csrf_token %}
            <div>
                  <h1>Join Today</h1>
                  {{ form.as_p }}
            </div>
            <div class="form-group">
                <button style="margin-left:10rem;" type="submit">Sign Up</button>
            </div>
        </form>
        <div class="border-top" pt-3>
            <small style="margin-left: 8rem;">
                Already have an account? <a class="ml-2" href="{% url 'login' %}">Sign In</a>
            </small>
        </div>
    </div>
{% endblock content %}
