{% extends "base.html" %}
{% block content%}
    <div class="container" style="height: 25rem;">
        <form method="POST">
            {% csrf_token %}
            <div>
                  <h1>Log In</h1>
                  {{ form.as_p }}
            </div>
            <div class="form-group">
                <button class="btn btn-outline-info" style="margin-left: 10rem;" type="submit">Login</button>
            </div>
        </form>
        <div class="border-top" pt-3>
            <small style="margin-left: 8rem;">
                Need an account? <a class="ml-2" href="{% url 'register' %}">Sign Up Now</a>
            </small>
        </div>
    </div>
{% endblock content %}
